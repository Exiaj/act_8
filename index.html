<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alert Box</title>
        <link rel="stylesheet" href="styles.css">
        <script>
            function myFunction() {
                var name = "Your name here";
                alert("Hi " + name + " I am an alert box!"); //+ sign is concatenation
            }
        </script>
    </head>
    <body>
        <main class="page-shell">
            <section class="card">
                <div class="card__headline">
                    <h1>JavaScript Alert</h1>
                    <p>Try the button below to see a JavaScript alert in action. This is a simple example of how JavaScript can interact with the user.</p>
                </div>
                <button class="action-button" onclick="myFunction()">Show alert</button>
            </section>
        </main>
    </body>
</html>
